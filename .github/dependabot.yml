version: 2
updates:
  # Application dependencies (Bun / npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # Security patches land immediately, on their own, so they are easy to review and merge
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
      # Routine version bumps are batched to keep PR noise low
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major upgrades are opt-in; they need a manual migration review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Keep the CI actions themselves patched
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
